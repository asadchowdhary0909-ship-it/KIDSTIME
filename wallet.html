<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KID WORLD - Wallet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="wallet">

    <div class="world-container">

        <header class="topbar">

            <a href="home.html" class="brand">
                🌍 KID WORLD
            </a>

            <div class="profile">

                <div class="avatar" id="avatar">
                    😊
                </div>

                <div class="profile-info">
                    <strong id="playerName">Player</strong>
                    <small id="playerUid">UID: KID-000000</small>
                </div>

                <a
                    href="accounts.html"
                    class="account-button"
                >
                    ⚙️
                </a>

            </div>

        </header>

        <nav class="navigation">

            <a href="home.html" class="nav-button">
                🏠 Home
            </a>

            <a href="games.html" class="nav-button">
                🐦 Games
            </a>

            <a href="videos.html" class="nav-button">
                📺 Video Shop
            </a>

            <a href="wallet.html" class="nav-button active">
                🪙 Wallet
            </a>

            <a href="chat.html" class="nav-button">
                💬 Live Chat
            </a>

        </nav>

        <main>

            <section class="page">

                <div class="section-title">

                    <h2>🪙 Wallet</h2>

                    <p>
                        Manage your PlayCoins.
                    </p>

                </div>

                <div class="wallet-big">

                    <span>
                        Total PlayCoins Balance
                    </span>

                    <strong id="walletBalance">
                        500
                    </strong>

                    <small>
                        Earn more coins by hitting highscores in games!
                    </small>

                </div>

                <div class="transactions">

                    <h3>
                        Recent Statements
                    </h3>

                    <div id="transactionList">
                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
