<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KID WORLD - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="login">
<center>
    <div class="login-screen">
        <div class="welcome-card">

            <div class="logo">🌍</div>

            <h1>KID WORLD</h1>

            <p class="subtitle">
                Join the ultimate digital playground!
            </p>

            <div class="login-box">
                
                <h2 id="loginTitle">Create Your Nickname</h2>
               
                <input
                    type="text"
                    id="nameInput"
                    placeholder="Enter your nickname..."
                    autocomplete="off"
                    maxlength="16"
                >
                
                <button
                    id="enterWorldBtn"
                    class="main-button"
                    type="button"
                >
                    ENTER WORLD 🚀
                </button>

                <div id="errorMessage" class="error"></div>

            </div>

            <p class="safe-text">
                🔒 Safe and secure login
            </p>

        </div>
    </div>
</center>
    <script src="script.js"></script>
</body>
</html>
